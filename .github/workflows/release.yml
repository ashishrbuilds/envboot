name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Package
        run: npm run build

      # 1. Publish to npmjs.org (Public npm Registry)
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. Publish to GitHub Packages (@ashishrbuilds/envboot)
      - name: Publish to GitHub Packages
        run: |
          npm pkg set name="@ashishrbuilds/envboot"
          npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"
          npm config set @ashishrbuilds:registry "https://npm.pkg.github.com"
          npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
